{% extends "base.html" %}
{% set nav = 'search' %}
{% block title %}Recherche — {{ APP_NAME }}{% endblock %}
{% block content %}
<form id="ref-search-form" action="/search-terms/terms" method="get"
      hx-get="/search-terms/terms" hx-target="#ref-search-body" hx-push-url="true"
      hx-trigger="change, submit, keyup changed delay:400ms from:#ref-query"
      hx-indicator="#ref-search-body">
  <div class="ref-searchbar mb-3">
    <div class="input-group">
      <span class="input-group-text"><i class="bi bi-search"></i></span>
      <input id="ref-query" type="search" name="query" value="{{ flt.query }}" class="form-control"
             placeholder="Code source, description ou libellé du concept cible" aria-label="Recherche" autocomplete="off">
      <button class="btn btn-primary" type="submit">Rechercher</button>
    </div>
  </div>
  <div id="ref-search-body" class="ref-loading">
    {% include "partials/_search_body.html" %}
  </div>
</form>
{% endblock %}
