[project]
name = "omop-referentiel"
version = "0.1.0"
description = "Référentiel mappings OMOP — AP-HM"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["app/static/vendor", "data", "var"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "T20"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
exclude = ["app/static/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
